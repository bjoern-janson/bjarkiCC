name: Validate bjarkiCC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4
      - name: Compile addon and exercise repository regression suites
        run: |
          set -euo pipefail
          for version in 5.1 5.4; do
            echo "Checking Lua ${version}"
            while IFS= read -r module; do
              "luac${version}" -p "$module"
            done < <(tr -d '\r' < bjarkiCC.toc | grep -vE '^#|^[[:space:]]*$')
            for test in tests/test_*.lua; do
              "luac${version}" -p "$test"
              "lua${version}" -e 'ADDON_DIR = "."; unpack = table.unpack or unpack' "$test"
            done
          done
      - name: Verify both manifests and stage clean addon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          from hashlib import sha256
          root = Path('.')
          manifests = [root/'bjarkiCC.toc', root/'bjarkiCC_Camelot.toc']
          assert manifests[0].read_bytes() == manifests[1].read_bytes(), "mismatched TOCs"
          modules = [line.strip() for line in manifests[0].read_text().splitlines()
                     if line.strip() and not line.startswith('#')]
          assert len(modules) == 15 and len(set(modules)) == 15, "unexpected module inventory"
          dest = root/'dist'/'bjarkiCC'
          dest.mkdir(parents=True, exist_ok=True)
          names = [p.name for p in manifests] + modules + ['THIRD_PARTY_NOTICES.txt']
          expected = {}
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name not in expected, f"duplicate checksum: {name}"
              expected[name] = digest
          assert set(expected) == set(names), "checksum inventory mismatch"
          for name in names:
              path = root/name
              assert path.is_file(), f"missing {path}"
              assert sha256(path.read_bytes()).hexdigest() == expected[name], f"checksum mismatch: {name}"
              copy2(path, dest/name)
          copy2(root/'SHA256SUMS.txt', dest/'SHA256SUMS.txt')
          assert {p.name for p in dest.iterdir()} == set(names) | {'SHA256SUMS.txt'}, "packaging mismatch"
          assert len(list(dest.iterdir())) == 19, "unexpected runtime inventory"
          print("Packaged 19 verified runtime files, including notices and checksums")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bjarkiCC
          path: dist
          if-no-files-found: error
